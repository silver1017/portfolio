<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"  aria-label="Maryam Shoaib monogram">
        <rect width="64" height="64" rx="12" fill="#0e1116"/><defs>
          <linearGradient id="mkA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc268"/>
            <stop offset="1" stop-color="#f0a132"/>
          </linearGradient>
          <linearGradient id="mkB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7a5418"/>
            <stop offset="1" stop-color="#432d0c"/>
          </linearGradient>
        </defs>
        <!-- recessed inner shards -->
        <path class="mark-edge" d="M14 30 L22 41 L22 55 L12 40 Z" fill="url(#mkB)" opacity=".85"/>
        <path class="mark-edge" d="M50 30 L42 41 L42 55 L52 40 Z" fill="url(#mkB)" opacity=".85"/>
